<script>
document.querySelector('.nav-toggle').addEventListener('click',function(){document.querySelector('.sidebar').classList.toggle('open');});

(function(){
  var channels = [
    { id: 'UCd8vNU9GdaDJF-jLDyWWvMw', name: 'サルベド漫画' },
    { id: 'UCXU7pjSKDNHAFKf36YxntMw', name: 'サルベド漫画Emotional' },
    { id: 'UCZRD5bbun-Dgxj2AG2PKbjg', name: 'サルベド漫画Fantasy' }
  ];
  var container = document.getElementById('latestVideos');
  function loadLatest(ch, retries) {
    var url = 'https://game.sarubedo.jp/yt-feed?id=' + ch.id;
    fetch(url).then(function(r) { if (!r.ok) throw new Error(r.status); return r.text(); }).then(function(xml) {
      var doc = new DOMParser().parseFromString(xml, 'text/xml');
      var entry = doc.querySelector('entry');
      if (!entry) {
        if (retries > 0) { setTimeout(function() { loadLatest(ch, retries - 1); }, 5000); } else {
          var fc = document.createElement('div'); fc.className = 'video-card';
          fc.innerHTML = '<div class="video-thumb" style="background:#1a1a2e;display:flex;align-items:center;justify-content:center;color:#666;cursor:pointer;" onclick="location.reload()">タップして再読み込み</div><p class="video-title">' + ch.name + '</p>';
          container.appendChild(fc);
        } return;
      }
      var videoId = entry.querySelector('videoId') ? entry.querySelector('videoId').textContent : '';
      var title = entry.querySelector('title') ? entry.querySelector('title').textContent : '';
      var card = document.createElement('div');
      card.className = 'video-card';
      card.innerHTML = '<div class="video-thumb"><iframe width="100%" height="100%" src="https://www.youtube.com/embed/' + videoId + '" frameborder="0" allowfullscreen loading="lazy"></iframe></div>' +
        '<p class="video-title" style="font-size:12px;margin-top:6px;color:#ccc;">' + ch.name + '</p>' +
        '<p class="video-title" style="font-size:13px;margin-top:2px;">' + title + '</p>';
      container.appendChild(card);
    }).catch(function() {
      if (retries > 0) { setTimeout(function() { loadLatest(ch, retries - 1); }, 5000); return; }
      var card = document.createElement('div');
      card.className = 'video-card';
      card.innerHTML = '<div class="video-thumb" style="background:#1a1a2e;display:flex;align-items:center;justify-content:center;color:#666;cursor:pointer;" onclick="location.reload()">タップして再読み込み</div><p class="video-title">' + ch.name + '</p>';
      container.appendChild(card);
    });
  }
  channels.forEach(function(ch) { loadLatest(ch, 3); });
})();
</script>
