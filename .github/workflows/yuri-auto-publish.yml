name: ユリ 原稿 自動公開

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 依存パッケージをインストール
        run: pip install google-auth requests

      - name: 原稿をDriveから取得してHTMLに変換
        env:
          YURI_GDRIVE_SA_KEY: ${{ secrets.YURI_GDRIVE_SA_KEY }}
          YURI_GDRIVE_FOLDER_ID: ${{ secrets.YURI_GDRIVE_FOLDER_ID }}
        run: python scripts/yuri_cloud_publish.py

      - name: 変更があればコミット
        id: commit
        run: |
          git config user.name "yuri-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -- blog.html blog-yuri.html blog-yuri-*.html
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "ユリ 原稿を自動更新（クラウド）"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: push（他の変更が先に入っていたら一度リベースしてから再push）
        if: steps.commit.outputs.changed == 'true'
        run: |
          git push || (git pull --rebase && git push)
