<style>
.gallery-page{max-width:1440px;margin:0 auto;padding:24px 24px 80px;}
.gallery-heading{text-align:center;margin-bottom:36px;}
.gallery-heading h1{font-family:'Murecho',sans-serif;font-size:30px;font-weight:900;color:#0a3d3a;letter-spacing:10px;}
.gallery-heading .en{font-size:10px;letter-spacing:6px;color:#888;font-weight:800;margin-top:10px;}

/* サムネイル均一グリッド */
.gallery-masonry{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;}
.gallery-item{display:block;break-inside:avoid;border-radius:4px;overflow:hidden;text-decoration:none;color:inherit;background:#f0f0f0;transition:transform 0.2s,box-shadow 0.2s;position:relative;aspect-ratio:1;}
.gallery-item:hover{transform:scale(1.04);box-shadow:0 8px 20px rgba(0,0,0,0.2);z-index:2;}
.gallery-item img{width:100%;height:100%;object-fit:cover;display:block;}

@media(max-width:1100px){.gallery-masonry{grid-template-columns:repeat(4,1fr);}}
@media(max-width:760px){.gallery-masonry{grid-template-columns:repeat(3,1fr);gap:6px;}}
@media(max-width:480px){
  .gallery-page{padding:20px 12px 60px;}
  .gallery-heading h1{font-size:22px;letter-spacing:5px;}
  .gallery-masonry{grid-template-columns:repeat(2,1fr);}
}

/* ライトボックス */
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,0.92);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;z-index:10000;opacity:0;transition:opacity 0.3s;}
.lightbox.open{display:flex;opacity:1;}
.lb-stage{max-width:92vw;max-height:88vh;display:flex;align-items:center;justify-content:center;}
.lb-stage img{max-width:92vw;max-height:88vh;width:auto;height:auto;display:block;box-shadow:0 20px 60px rgba(0,0,0,0.5);border-radius:6px;}
.lb-close{position:absolute;top:18px;right:24px;background:rgba(255,255,255,0.12);border:none;color:#fff;width:46px;height:46px;border-radius:50%;font-size:28px;font-weight:300;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background 0.2s,transform 0.2s;line-height:1;}
.lb-close:hover{background:rgba(255,255,255,0.25);transform:scale(1.08);}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,0.12);border:none;color:#fff;width:54px;height:54px;border-radius:50%;font-size:32px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background 0.2s,transform 0.2s;line-height:1;padding:0;}
.lb-nav:hover{background:rgba(255,255,255,0.25);}
.lb-prev{left:24px;}
.lb-prev:hover{transform:translateY(-50%) translateX(-3px);}
.lb-next{right:24px;}
.lb-next:hover{transform:translateY(-50%) translateX(3px);}
.lb-counter{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,0.7);font-size:13px;letter-spacing:3px;font-weight:700;font-family:'Murecho',sans-serif;}
@media(max-width:600px){
  .lb-close{top:10px;right:10px;width:38px;height:38px;font-size:22px;}
  .lb-nav{width:42px;height:42px;font-size:26px;}
  .lb-prev{left:6px;}
  .lb-next{right:6px;}
}
</style>

  <div class="lightbox" id="lightbox" aria-hidden="true">
    <button class="lb-close" id="lbClose" aria-label="閉じる">×</button>
    <button class="lb-nav lb-prev" id="lbPrev" aria-label="前の画像">‹</button>
    <button class="lb-nav lb-next" id="lbNext" aria-label="次の画像">›</button>
    <div class="lb-stage"><img id="lbImg" src="" alt=""></div>
    <div class="lb-counter" id="lbCounter"></div>
  </div>

  <script>
  (function(){
    var items=Array.prototype.slice.call(document.querySelectorAll('#galleryGrid .gallery-item'));
    var lb=document.getElementById('lightbox');
    var lbImg=document.getElementById('lbImg');
    var lbCounter=document.getElementById('lbCounter');
    var idx=0;
    function open(i){
      idx=i;
      lbImg.src=items[idx].getAttribute('href');
      lbCounter.textContent=(idx+1)+' / '+items.length;
      lb.classList.add('open');
      document.body.style.overflow='hidden';
    }
    function close(){
      lb.classList.remove('open');
      document.body.style.overflow='';
      setTimeout(function(){lbImg.src='';},300);
    }
    function next(){idx=(idx+1)%items.length;open(idx);}
    function prev(){idx=(idx-1+items.length)%items.length;open(idx);}
    items.forEach(function(a,i){a.addEventListener('click',function(e){e.preventDefault();open(i);});});
    document.getElementById('lbClose').addEventListener('click',close);
    document.getElementById('lbNext').addEventListener('click',function(e){e.stopPropagation();next();});
    document.getElementById('lbPrev').addEventListener('click',function(e){e.stopPropagation();prev();});
    lb.addEventListener('click',function(e){if(e.target===lb||e.target.classList.contains('lb-stage'))close();});
    document.addEventListener('keydown',function(e){
      if(!lb.classList.contains('open'))return;
      if(e.key==='Escape')close();
      else if(e.key==='ArrowRight')next();
      else if(e.key==='ArrowLeft')prev();
    });
  })();
  </script>
