<meta name="description" content="サルベド漫画 オフィシャルグッズ — BOOTHとLINEスタンプ">
<title>オフィシャルグッズ — サルベド漫画</title>
<link rel="stylesheet" href="style.css?v=7">
<style>
.goods-page{max-width:1200px;margin:0 auto;padding:80px 32px 60px;}
.goods-heading{text-align:center;margin-bottom:60px;}
.goods-heading h1{font-size:38px;font-weight:900;color:#1a1a1a;letter-spacing:6px;margin-bottom:6px;}
.goods-heading .en{font-size:13px;color:#888;letter-spacing:6px;}

.goods-pair{display:grid;grid-template-columns:1fr 1fr;gap:40px;}
.goods-tile{display:block;background:#fff;border:1px solid #e0e0e0;border-radius:16px;overflow:hidden;text-decoration:none;color:inherit;transition:transform 0.25s,box-shadow 0.25s,border-color 0.25s;}
.goods-tile:hover{transform:translateY(-6px);box-shadow:0 16px 36px rgba(0,0,0,0.12);border-color:#00DFD8;}
.goods-tile-banner{aspect-ratio:16/9;background:#f5f5f5;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;}
.goods-tile-banner img{width:100%;height:100%;object-fit:cover;display:block;transition:transform 0.3s;}
.goods-tile:hover .goods-tile-banner img{transform:scale(1.04);}
.goods-tile-banner.placeholder-booth{background:linear-gradient(135deg,#FC4D50 0%,#E53942 100%);color:#fff;}
.goods-tile-banner.placeholder-line{background:linear-gradient(135deg,#06C755 0%,#04A848 100%);color:#fff;}
.goods-tile-banner .placeholder-content{text-align:center;padding:24px;}
.goods-tile-banner .placeholder-logo{font-size:42px;font-weight:900;letter-spacing:6px;margin-bottom:6px;text-shadow:0 2px 6px rgba(0,0,0,0.2);}
.goods-tile-banner .placeholder-sub{font-size:14px;letter-spacing:3px;opacity:0.95;}

.goods-tile-body{padding:24px 28px;}
.goods-tile-name{font-size:20px;font-weight:800;color:#1a1a1a;letter-spacing:2px;margin-bottom:8px;}
.goods-tile-desc{font-size:13px;color:#666;line-height:1.7;margin-bottom:16px;}
.goods-tile-cta{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:#00DFD8;font-weight:800;letter-spacing:1px;}
.goods-tile-cta::after{content:'→';font-size:16px;transition:transform 0.2s;}
.goods-tile:hover .goods-tile-cta::after{transform:translateX(4px);}

@media(max-width:760px){
  .goods-page{padding:50px 16px;}
  .goods-heading h1{font-size:28px;letter-spacing:3px;}
  .goods-pair{grid-template-columns:1fr;gap:24px;}
}
</style>

<div class="main-wrap">
  <div class="goods-page">
    <div class="goods-heading">
      <h1>オフィシャルグッズ</h1>
      <p class="en">OFFICIAL GOODS</p>
    </div>

    <div class="goods-pair">
      <!-- BOOTH -->
      <a href="https://sarubedo.booth.pm/" target="_blank" rel="noopener noreferrer" class="goods-tile">
        <div class="goods-tile-banner placeholder-booth">
          <div class="placeholder-content">
            <div class="placeholder-logo">BOOTH</div>
            <div class="placeholder-sub">SARUBEDO OFFICIAL SHOP</div>
          </div>
        </div>
        <div class="goods-tile-body">
          <h3 class="goods-tile-name">BOOTHショップ</h3>
          <p class="goods-tile-desc">アクリルスタンド、缶バッジ、ステッカー、その他オフィシャルグッズを販売中。</p>
          <span class="goods-tile-cta">BOOTHで見る</span>
        </div>
      </a>

      <!-- LINEスタンプ -->
      <a href="https://store.line.me/stickershop/product/20622058/ja" target="_blank" rel="noopener noreferrer" class="goods-tile">
        <div class="goods-tile-banner placeholder-line">
          <div class="placeholder-content">
            <div class="placeholder-logo">LINE</div>
            <div class="placeholder-sub">STAMP STORE</div>
          </div>
        </div>
        <div class="goods-tile-body">
          <h3 class="goods-tile-name">LINEスタンプ</h3>
          <p class="goods-tile-desc">サルベド漫画キャラクターのLINEスタンプ。日常会話で使えるかわいい・コミカルなセット。</p>
          <span class="goods-tile-cta">LINEストアで見る</span>
        </div>
      </a>
    </div>
  </div>
