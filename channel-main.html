<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="サルベド漫画 メインチャンネル — サルベド漫画">
<title>メインチャンネル サルベド漫画 — サルベド漫画</title>
<link rel="stylesheet" href="style.css?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&display=swap" rel="stylesheet">
<style>
.ch-detail{position:relative;min-height:calc(100vh - 110px);padding:60px 32px 60px;background-size:cover;background-position:center;background-repeat:no-repeat;display:flex;flex-direction:column;width:100%!important;box-sizing:border-box;}
.ch-detail::before{content:'';position:absolute;inset:0;background:rgba(255,255,255,0.28);pointer-events:none;}
.ch-detail > *{position:relative;z-index:1;}
.ch-detail-inner{max-width:1200px;margin:0 auto;width:100%;flex:1;display:flex;flex-direction:column;}
.ch-detail-header{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-bottom:40px;align-items:end;}
.ch-detail-category{font-size:var(--cat-fs,18px);font-weight:400;color:#1a1a1a;letter-spacing:var(--cat-ls,5px);margin-bottom:6px;font-family:'Mochiy Pop One','Hiragino Kaku Gothic Pro',sans-serif;}
.ch-detail-name{font-size:var(--name-fs,48px);font-weight:400;color:#1a1a1a;letter-spacing:var(--name-ls,7px);line-height:1.2;font-family:'Mochiy Pop One','Hiragino Kaku Gothic Pro',sans-serif;padding-left:var(--name-pl,40px);}
.ch-detail-desc{font-size:var(--desc-fs,16px);line-height:1.8;color:#1a1a1a;font-weight:400;letter-spacing:var(--desc-ls,1px);padding:14px 18px;background:rgba(255,255,255,0.55);border-radius:8px;backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);font-family:'Mochiy Pop One','Hiragino Kaku Gothic Pro',sans-serif;}
.ch-detail-video{max-width:var(--video-w,680px);margin:0 auto 50px;width:100%;aspect-ratio:16/9;border-radius:10px;overflow:hidden;box-shadow:0 12px 32px rgba(0,0,0,0.45);position:relative;background:#000;}
.ch-detail-video .video-thumb-poster{position:relative;width:100%;height:100%;cursor:pointer;background:#000;overflow:hidden;display:block;}
.ch-detail-video .video-thumb-poster img{width:100%;height:100%;object-fit:cover;display:block;transition:transform 0.3s ease;}
.ch-detail-video .video-thumb-poster:hover img{transform:scale(1.03);}
.ch-detail-video .video-play-btn{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:88px;height:62px;border-radius:14px;background:rgba(255,0,0,0.92);display:flex;align-items:center;justify-content:center;color:#fff;font-size:32px;padding-left:4px;box-shadow:0 4px 14px rgba(0,0,0,0.35);transition:background 0.2s;}
.ch-detail-video:hover .video-play-btn{background:#FF0000;}
.ch-detail-footer{display:flex;justify-content:space-between;align-items:center;margin-top:auto;}
.ch-detail-back{font-size:var(--back-fs,16px);color:#1a1a1a;font-weight:400;text-decoration:none;letter-spacing:var(--back-ls,2px);font-family:'Mochiy Pop One','Hiragino Kaku Gothic Pro',sans-serif;}
.ch-detail-back:hover{color:#6FDFD6;}
.ch-detail-more{background:#6FDFD6;color:#0a3d3a;padding:var(--more-py,14px) var(--more-px,32px);border-radius:30px;font-size:var(--more-fs,14px);font-weight:400;letter-spacing:var(--more-ls,2px);text-decoration:none;box-shadow:0 4px 14px rgba(111,223,214,0.4);transition:all 0.2s;font-family:'Mochiy Pop One','Hiragino Kaku Gothic Pro',sans-serif;}
.ch-detail-more:hover{background:#5BC9C0;transform:translateY(-2px);color:#0a3d3a;box-shadow:0 8px 24px rgba(111,223,214,0.5);}

@media(max-width:760px){
  .ch-detail-header{grid-template-columns:1fr;gap:20px;}
  .ch-detail-name{font-size:34px;padding-left:0;letter-spacing:4px;}
  .ch-detail-category{font-size:14px;letter-spacing:3px;}
  .ch-detail-desc{font-size:14px;}
  .ch-detail-footer{flex-direction:column;gap:16px;}
}

/* === 位置・サイズ調整（各要素） === */
:root{
  /* 位置 X/Y */
  --cat-x:96px;--cat-y:-39px;
  --name-x:120px;--name-y:-38px;
  --desc-x:19px;--desc-y:-22px;
  --video-y:-16px;
  --back-x:-23px;--back-y:-99px;
  --more-x:48px;--more-y:-88px;
  /* サイズ */
  --cat-fs:23px;--cat-ls:5px;
  --name-fs:48px;--name-ls:7px;--name-pl:40px;
  --desc-fs:16px;--desc-ls:5.5px;
  --video-w:680px;
  --back-fs:16px;--back-ls:2px;
  --more-fs:14px;--more-ls:2px;--more-px:32px;--more-py:14px;
}
.ch-detail-category{position:relative;left:var(--cat-x,0);top:var(--cat-y,0);}
.ch-detail-name{position:relative;left:var(--name-x,0);top:var(--name-y,0);}
.ch-detail-desc{position:relative;left:var(--desc-x,0);top:var(--desc-y,0);}
.ch-detail-video{position:relative;top:var(--video-y,0);}
.ch-detail-back{position:relative;left:var(--back-x,0);top:var(--back-y,0);}
.ch-detail-more{position:relative;left:var(--more-x,0);top:var(--more-y,0);}

/* === アニメーション B: 漫画ポップイン === */
.ch-detail::before{opacity:0;animation:bgFadeIn 0.3s ease-out forwards;}
.ch-detail-category{opacity:0;animation:popIn 0.5s cubic-bezier(0.34,1.56,0.64,1) 0.2s forwards;}
.ch-detail-name{opacity:0;animation:popIn 0.5s cubic-bezier(0.34,1.56,0.64,1) 0.35s forwards;}
.ch-detail-desc{opacity:0;animation:popIn 0.4s cubic-bezier(0.34,1.56,0.64,1) 0.55s forwards;}
.ch-detail-video{opacity:0;animation:popIn 0.4s cubic-bezier(0.34,1.56,0.64,1) 0.75s forwards;}
.ch-detail-footer{opacity:0;animation:popIn 0.4s cubic-bezier(0.34,1.56,0.64,1) 0.95s forwards;}
@keyframes bgFadeIn{from{opacity:0;}to{opacity:1;}}
@keyframes popIn{0%{opacity:0;transform:scale(0.6);}60%{opacity:1;transform:scale(1.08);}100%{opacity:1;transform:scale(1);}}
</style>

</head>
<body>

<div class="main-wrap">
  <section class="ch-detail" style="background-image:url('img/classroom-bg.jpg');">
    <div class="ch-detail-inner">
      <div class="ch-detail-header">
        <div>
          <p class="ch-detail-category">メインチャンネル</p>
          <h1 class="ch-detail-name">サルベド漫画</h1>
        </div>
        <p class="ch-detail-desc">テンポのいいラブコメディが中心の、サルベド漫画のメインチャンネル！サルベド語録はここからはじまった。</p>
      </div>
      <div class="ch-detail-video">
        <div class="video-thumb-poster" data-id="oys9pZGfkvo">
          <img src="https://i.ytimg.com/vi/oys9pZGfkvo/hqdefault.jpg" alt="サルベド漫画 代表動画">

        </div>

      <div class="ch-detail-footer">

</div>

<script>
document.querySelector(".nav-toggle").addEventListener("click",function(){document.querySelectorAll(".site-header nav").forEach(function(n){n.classList.toggle("open");});});

document.querySelectorAll('.video-thumb-poster').forEach(function(poster){
  poster.addEventListener('click', function(){
    var id = this.dataset.id;
    var iframe = document.createElement('iframe');
    iframe.src = 'https://www.youtube.com/embed/' + id + '?autoplay=1&rel=0';
    iframe.setAttribute('allowfullscreen','');
    iframe.setAttribute('allow','autoplay; encrypted-media; picture-in-picture');
    iframe.setAttribute('frameborder','0');
    iframe.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;border:0;';
    this.parentNode.replaceChild(iframe, this);
  });
});
</script>
