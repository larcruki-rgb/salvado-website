<div class="main-wrap">
  <div class="page-content">

  <footer>
    <div class="footer-inner">

    </div>
  </footer>
</div>

<script>
document.querySelector(".nav-toggle").addEventListener("click",function(){document.querySelector(".sidebar").classList.toggle("open");});

(function(){
  var channels = [
    { id: 'UCd8vNU9GdaDJF-jLDyWWvMw', name: 'サルベド漫画', url: 'https://www.youtube.com/@sarubedo_D' },
    { id: 'UCXU7pjSKDNHAFKf36YxntMw', name: 'サルベド漫画Emotional', url: 'https://www.youtube.com/@sarubedomangaemotional' },
    { id: 'UCZRD5bbun-Dgxj2AG2PKbjg', name: 'サルベド漫画Fantasy', url: 'https://www.youtube.com/@%E3%82%B5%E3%83%AB%E3%83%99%E3%83%89%E6%BC%AB%E7%94%BB%E3%83%95%E3%82%A1%E3%83%B3%E3%82%BF%E3%82%B8%E3%83%BC' },
    { id: 'UCfQc3kV_jTqhbUInszNxArA', name: '死神少女', url: 'https://www.youtube.com/@%E6%AD%BB%E7%A5%9E%E5%B0%91%E5%A5%B3-p3u' }
  ];
  var container = document.getElementById('channelVideos');
  channels.forEach(function(ch) {
    var section = document.createElement('div');
    section.style.marginBottom = '40px';
    var heading = document.createElement('h2');
    heading.textContent = ch.name;
    section.appendChild(heading);
    var grid = document.createElement('div');
    grid.className = 'video-grid';
    grid.innerHTML = '<div class="video-card"><div class="video-thumb" style="background:#1a1a2e;display:flex;align-items:center;justify-content:center;color:#666;">読み込み中...</div></div>';
    section.appendChild(grid);
    var link = document.createElement('div');
    link.className = 'section-more';
    link.innerHTML = '<a href="' + ch.url + '" target="_blank">チャンネルで見る →</a>';
    section.appendChild(link);
    container.appendChild(section);

    var feedUrl = 'https://corsproxy.io/?' + encodeURIComponent('https://www.youtube.com/feeds/videos.xml?channel_id=' + ch.id);
    fetch(feedUrl).then(function(r) { return r.text(); }).then(function(xml) {
      var doc = new DOMParser().parseFromString(xml, 'text/xml');
      var entries = doc.querySelectorAll('entry');
      grid.innerHTML = '';
      var count = Math.min(entries.length, 3);
      for (var i = 0; i < count; i++) {
        var entry = entries[i];
        var videoId = entry.querySelector('videoId') ? entry.querySelector('videoId').textContent : '';
        var title = entry.querySelector('title') ? entry.querySelector('title').textContent : '';
        var card = document.createElement('div');
        card.className = 'video-card';
        card.innerHTML = '<div class="video-thumb"><iframe width="100%" height="100%" src="https://www.youtube.com/embed/' + videoId + '" frameborder="0" allowfullscreen loading="lazy"></iframe></div>' +
          '<p class="video-title" style="font-size:13px;margin-top:6px;">' + title + '</p>';
        grid.appendChild(card);
      }
      if (count === 0) {
        grid.innerHTML = '<div class="video-card"><div class="video-thumb" style="background:#1a1a2e;display:flex;align-items:center;justify-content:center;color:#666;">動画がありません</div></div>';
      }
    }).catch(function() {
      grid.innerHTML = '<div class="video-card"><div class="video-thumb" style="background:#1a1a2e;display:flex;align-items:center;justify-content:center;color:#666;">読み込めませんでした</div></div>';
    });
  });
})();
</script>
</body>
</html>
