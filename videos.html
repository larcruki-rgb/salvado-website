<script>
document.querySelector(".nav-toggle")&&document.querySelector(".nav-toggle").addEventListener("click",function(){document.querySelectorAll(".site-header nav").forEach(function(n){n.classList.toggle("open");});});

(function(){
  var channels = [
    { id: 'UCd8vNU9GdaDJF-jLDyWWvMw', name: 'サルベド漫画', url: 'https://www.youtube.com/@sarubedo_D' },
    { id: 'UCXU7pjSKDNHAFKf36YxntMw', name: 'サルベド漫画Emotional', url: 'https://www.youtube.com/@sarubedomangaemotional' },
    { id: 'UCZRD5bbun-Dgxj2AG2PKbjg', name: 'サルベド漫画Fantasy', url: 'https://www.youtube.com/@%E3%82%B5%E3%83%AB%E3%83%99%E3%83%89%E6%BC%AB%E7%94%BB%E3%83%95%E3%82%A1%E3%83%B3%E3%82%BF%E3%82%B8%E3%83%BC' },
    { id: 'UCfQc3kV_jTqhbUInszNxArA', name: '死神少女', url: 'https://www.youtube.com/@%E6%AD%BB%E7%A5%9E%E5%B0%91%E5%A5%B3-p3u' }
  ];
  var container = document.getElementById('channelVideos');
  channels.forEach(function(ch) {
    var section = document.createElement('div');
    section.style.marginBottom = '40px';
    var heading = document.createElement('h2');
    heading.textContent = ch.name;
    section.appendChild(heading);
    var grid = document.createElement('div');
    grid.className = 'video-grid';
    grid.innerHTML = '<div class="video-card"><div class="video-thumb" style="background:#f0f0f0;display:flex;align-items:center;justify-content:center;color:#888;">読み込み中...</div></div>';
    section.appendChild(grid);
    var link = document.createElement('div');
    link.className = 'section-more';
    link.innerHTML = '<a href="' + ch.url + '" target="_blank" rel="noopener noreferrer">チャンネルで見る →</a>';
    section.appendChild(link);
    container.appendChild(section);

    function loadFeed(chId, targetGrid, retries) {
      var feedUrl = 'https://game.sarubedo.jp/yt-feed?id=' + chId;
      fetch(feedUrl).then(function(r) { if (!r.ok) throw new Error(r.status); return r.text(); }).then(function(xml) {
        var doc = new DOMParser().parseFromString(xml, 'text/xml');
        var entries = doc.querySelectorAll('entry');
        var count = Math.min(entries.length, 3);
        if (count > 0) {
          targetGrid.innerHTML = '';
          for (var i = 0; i < count; i++) {
            var entry = entries[i];
            var videoId = entry.querySelector('videoId') ? entry.querySelector('videoId').textContent : '';
            var title = entry.querySelector('title') ? entry.querySelector('title').textContent : '';
            var card = document.createElement('div');
            card.className = 'video-card';
            card.innerHTML = '<div class="video-thumb"><iframe width="100%" height="100%" src="https://www.youtube.com/embed/' + videoId + '" frameborder="0" allowfullscreen loading="lazy"></iframe></div>' +
              '<p class="video-title" style="font-size:13px;margin-top:6px;">' + title + '</p>';
            targetGrid.appendChild(card);
          }
        } else if (retries > 0) {
          setTimeout(function() { loadFeed(chId, targetGrid, retries - 1); }, 5000);
        } else {
          targetGrid.innerHTML = '<div class="video-card"><div class="video-thumb" style="background:#f0f0f0;display:flex;align-items:center;justify-content:center;color:#888;cursor:pointer;" onclick="location.reload()">タップして再読み込み</div></div>';
        }
      }).catch(function() {
        if (retries > 0) {
          setTimeout(function() { loadFeed(chId, targetGrid, retries - 1); }, 5000);
        } else {
          targetGrid.innerHTML = '<div class="video-card"><div class="video-thumb" style="background:#f0f0f0;display:flex;align-items:center;justify-content:center;color:#888;cursor:pointer;" onclick="location.reload()">タップして再読み込み</div></div>';
        }
      });
    }
    loadFeed(ch.id, grid, 3);
  });
})();
</script>
