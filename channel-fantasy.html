<style>
@font-face{font-family:'KillgoU-NB';src:url('img/fonts/KillgoU-NB.ttf') format('truetype');font-display:swap;}
.ch-detail{position:relative;min-height:calc(100vh - 110px);padding:60px 32px 60px;background-size:cover;background-position:center;background-repeat:no-repeat;display:flex;flex-direction:column;width:100%!important;box-sizing:border-box;}
.ch-detail::before{content:'';position:absolute;inset:0;background:transparent;pointer-events:none;}
.ch-detail > *{position:relative;z-index:1;}
.ch-detail-inner{max-width:1200px;margin:0 auto;width:100%;flex:1;display:flex;flex-direction:column;}
.ch-detail-header{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-bottom:40px;align-items:end;}
.ch-detail-category{font-size:var(--cat-fs,18px);font-weight:500;color:#1a1a1a;letter-spacing:var(--cat-ls,5px);margin-bottom:6px;font-family:'KillgoU-NB','Hiragino Kaku Gothic Pro',sans-serif;text-shadow:2px 0 0 #fff,-2px 0 0 #fff,0 2px 0 #fff,0 -2px 0 #fff,1.5px 1.5px 0 #fff,-1.5px -1.5px 0 #fff,1.5px -1.5px 0 #fff,-1.5px 1.5px 0 #fff;}
.ch-detail-name{font-size:var(--name-fs,48px);font-weight:500;color:#1a1a1a;letter-spacing:var(--name-ls,7px);line-height:1.2;font-family:'KillgoU-NB','Hiragino Kaku Gothic Pro',sans-serif;padding-left:var(--name-pl,40px);text-shadow:3px 0 0 #fff,-3px 0 0 #fff,0 3px 0 #fff,0 -3px 0 #fff,2px 2px 0 #fff,-2px -2px 0 #fff,2px -2px 0 #fff,-2px 2px 0 #fff;}
.ch-detail-desc{font-size:var(--desc-fs,16px);line-height:1.8;color:#1a1a1a;font-weight:500;letter-spacing:var(--desc-ls,1px);padding:14px 18px;background:rgba(255,255,255,0.55);border-radius:8px;backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);font-family:'KillgoU-NB','Hiragino Kaku Gothic Pro',sans-serif;}
.ch-detail-video{max-width:var(--video-w,680px);margin:0 auto 50px;width:100%;aspect-ratio:16/9;border-radius:10px;overflow:hidden;box-shadow:0 12px 32px rgba(0,0,0,0.45);position:relative;background:#000;}
.ch-detail-video .video-thumb-poster{position:relative;width:100%;height:100%;cursor:pointer;background:#000;overflow:hidden;display:block;}
.ch-detail-video .video-thumb-poster img{width:100%;height:100%;object-fit:cover;display:block;transition:transform 0.3s ease;}
.ch-detail-video .video-thumb-poster:hover img{transform:scale(1.03);}
.ch-detail-video .video-play-btn{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:88px;height:62px;border-radius:14px;background:rgba(255,0,0,0.92);display:flex;align-items:center;justify-content:center;color:#fff;font-size:32px;padding-left:4px;box-shadow:0 4px 14px rgba(0,0,0,0.35);transition:background 0.2s;}
.ch-detail-video:hover .video-play-btn{background:#FF0000;}
.ch-detail-footer{display:flex;justify-content:space-between;align-items:center;margin-top:auto;}
.ch-detail-back{font-size:var(--back-fs,16px);color:#1a1a1a;font-weight:500;text-decoration:none;letter-spacing:var(--back-ls,2px);font-family:'KillgoU-NB','Hiragino Kaku Gothic Pro',sans-serif;}
.ch-detail-back:hover{color:#00DFD8;}
.ch-detail-more{background:#00DFD8;color:#fff;padding:var(--more-py,14px) var(--more-px,32px);border-radius:30px;font-size:var(--more-fs,14px);font-weight:500;letter-spacing:var(--more-ls,2px);text-decoration:none;box-shadow:0 4px 14px rgba(0,223,216,0.4);transition:all 0.2s;font-family:'KillgoU-NB','Hiragino Kaku Gothic Pro',sans-serif;}
.ch-detail-more:hover{background:#00C5BE;transform:translateY(-2px);color:#fff;box-shadow:0 8px 24px rgba(0,223,216,0.5);}

@media(max-width:760px){
  .ch-detail-header{grid-template-columns:1fr;gap:20px;}
  .ch-detail-name{font-size:34px;padding-left:0;letter-spacing:4px;}
  .ch-detail-category{font-size:14px;letter-spacing:3px;}
  .ch-detail-desc{font-size:14px;}
  .ch-detail-footer{flex-direction:column;gap:16px;}
}

/* === 位置・サイズ調整（各要素） === */
:root{
  /* 位置 X/Y */
  --cat-x:96px;--cat-y:-39px;
  --name-x:66px;--name-y:-38px;
  --desc-x:19px;--desc-y:-22px;
  --video-y:-16px;
  --back-x:-23px;--back-y:-99px;
  --more-x:48px;--more-y:-88px;
  /* サイズ */
  --cat-fs:18px;--cat-ls:5px;
  --name-fs:36px;--name-ls:7px;--name-pl:40px;
  --desc-fs:16px;--desc-ls:4.5px;
  --video-w:680px;
  --back-fs:16px;--back-ls:2px;
  --more-fs:14px;--more-ls:2px;--more-px:32px;--more-py:14px;
}
.ch-detail-category{position:relative;left:var(--cat-x,0);top:var(--cat-y,0);}
.ch-detail-name{position:relative;left:var(--name-x,0);top:var(--name-y,0);}
.ch-detail-desc{position:relative;left:var(--desc-x,0);top:var(--desc-y,0);}
.ch-detail-video{position:relative;top:var(--video-y,0);}
.ch-detail-back{position:relative;left:var(--back-x,0);top:var(--back-y,0);}
.ch-detail-more{position:relative;left:var(--more-x,0);top:var(--more-y,0);}

/* === アニメーション: 床魔法陣 → 光の柱召喚 === */
.ch-detail{position:relative;overflow:hidden;perspective:1500px;}
.ch-detail-inner{position:relative;z-index:3;}
.sparkle{position:absolute;width:18px;height:18px;background:#FDD854;clip-path:polygon(50% 0%,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0% 50%,40% 40%);filter:drop-shadow(0 0 6px rgba(255,255,255,0.9));opacity:0;z-index:9;pointer-events:none;animation:sparkleTwinkle 0.8s ease-out forwards;}
.sparkle.s2{width:12px;height:12px;background:#fff;}
.sparkle.s3{width:24px;height:24px;background:#FDC06F;}
.ch-detail::before{opacity:0;animation:bgFadeIn 0.4s ease-out 0.1s forwards;}

/* 魔法陣：床に投影（グロー無しでクッキリ） */
.magic-circle{position:absolute;bottom:-220px;left:50%;width:760px;height:760px;background:url('img/magic-circle.png') center/contain no-repeat;opacity:0;pointer-events:none;z-index:0;transform:translateX(-50%) rotateX(72deg) scale(0);transform-origin:50% 100%;animation:circleFloor 1.0s ease-out 0.05s forwards;}

/* 光の柱 */
.light-pillar{position:absolute;bottom:0;left:50%;width:480px;height:0;background:linear-gradient(180deg,rgba(0,223,216,0) 0%,rgba(120,240,235,0.5) 30%,rgba(230,255,254,0.75) 100%);transform:translateX(-50%);filter:blur(12px);opacity:0;pointer-events:none;z-index:1;animation:pillarRise 0.8s ease-out 0.4s forwards;}

/* テキスト・動画は光の柱から召喚 */
.ch-detail-category,.ch-detail-name,.ch-detail-desc{opacity:1;}
.ch-detail-category .title-text,.ch-detail-name .title-text,.ch-detail-desc .title-text{display:inline;opacity:1;}
.ch-detail-category{animation:summonInLight 0.7s ease-out 0.7s backwards;}
.ch-detail-name{animation:summonInLight 0.7s ease-out 0.75s backwards;}
.ch-detail-desc{animation:summonInLight 0.7s ease-out 0.85s backwards;}
.ch-detail-video{animation:summonInLight 0.7s ease-out 0.95s backwards;}
.ch-detail-footer{animation:fadeUp 0.5s ease-out 1.2s backwards;}

@keyframes bgFadeIn{from{opacity:0;}to{opacity:1;}}
@keyframes fadeUp{from{opacity:0;transform:translateY(24px);}to{opacity:1;transform:translateY(0);}}
@keyframes circleFloor{
  0%{opacity:0;transform:translateX(-50%) rotateX(72deg) scale(0);}
  30%{opacity:1;transform:translateX(-50%) rotateX(72deg) scale(1);}
  100%{opacity:1;transform:translateX(-50%) rotateX(72deg) scale(1.04);}
}
@keyframes pillarRise{
  0%{opacity:0;height:0;}
  50%{opacity:1;height:520px;}
  100%{opacity:0.45;height:520px;}
}
@keyframes summonInLight{
  from{opacity:0;transform:translateY(200px) scale(0.55);filter:blur(8px) brightness(2.3);}
  to{opacity:1;transform:translateY(0) scale(1);filter:blur(0) brightness(1);}
}
@keyframes sparkleTwinkle{
  0%{opacity:0;transform:scale(0) rotate(0deg);}
  40%{opacity:1;transform:scale(1.6) rotate(180deg);}
  100%{opacity:0;transform:scale(0.4) rotate(360deg);}
}

  });
});
